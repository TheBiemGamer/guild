[package]
name = "launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
keyvalues-parser = "0.2"
reqwest = "0.13"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamlocate = "2.1"
tauri = { version = "2", features = ["protocol-asset"] }
winreg = "0.56"

[build-dependencies]
tauri-build = "2"
