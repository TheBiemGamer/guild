[package]
name = "launcher"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
directories = "6"
fs-err = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jiff = "0.2"
keyring-core = "1"
keyvalues-parser = "0.2"
protobuf = "3.5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.13", features = ["form"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
steam-vent = { git = "https://codeberg.org/steam-vent/steam-vent", rev = "b0e40109dd7a1b5101e1546ed27f62663dbe5c4b" }
steam-vent-proto-steam = "0.5.2"
steamlocate = "2.1"
thiserror = "2"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["system-proxy"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["typescript"] }
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
winreg = "0.56"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
insta = { version = "1.49", features = ["yaml", "json", "redactions"] }
tempfile = "3"
