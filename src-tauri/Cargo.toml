[package]
name = "launcher"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
keyring-core = "1"
keyvalues-parser = "0.2"
protobuf = "3.5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.13", features = ["form"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steam-vent = { git = "https://codeberg.org/steam-vent/steam-vent", rev = "b0e40109dd7a1b5101e1546ed27f62663dbe5c4b" }
steam-vent-proto-steam = "0.5.2"
steamlocate = "2.1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", default-features = false, features = ["sync"] }
windows-native-keyring-store = { version = "1.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
winreg = "0.56"

[build-dependencies]
tauri-build = { version = "2", features = [] }
