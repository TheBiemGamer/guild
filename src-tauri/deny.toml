# cargo-deny: run `cargo deny check` from src-tauri/.
[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # rsa timing side channel; no fixed release exists. Pulled in by steam-vent
    # for the Steam logon password encryption.
    { id = "RUSTSEC-2023-0071", reason = "no fix upstream; steam-vent dependency" },
    # protobuf recursion crash; steam-vent-proto-common pins protobuf =3.5.1.
    { id = "RUSTSEC-2024-0437", reason = "pinned by steam-vent-proto-common" },
]

[licenses]
# Only licenses that can ship inside a GPL-3.0-or-later binary.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    # Mozilla's CA root data in webpki-roots; a permissive data license.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://codeberg.org/steam-vent/steam-vent"]

# steam-vent-core has no license field; the steam-vent repo is MIT.
[[licenses.clarify]]
crate = "steam-vent-core"
expression = "MIT"
license-files = []
