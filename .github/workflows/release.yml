# A pushed v* tag builds and signs the Windows installer and the Linux AppImage and .deb, then publishes a
# GitHub release with them and latest.json for the updater. A manual run only builds and signs, and keeps
# the files as workflow artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    # The signing key lives in this environment, which only v* tags may use.
    environment: release
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - run: npm run check
      - run: npm test
      - run: cargo test
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Check the versions and read the release notes
        id: notes
        if: github.event_name == 'push'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $version = $env:TAG -replace '^v', ''
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($npm -ne $version -or $cargo -ne $version) {
            Write-Error "Tag $env:TAG, package.json $npm and Cargo.toml $cargo must match. Run npm run bump $version."
            exit 1
          }
          $notes = node scripts/release-notes.ts $version
          if ($LASTEXITCODE) { exit 1 }
          $delimiter = "NOTES_$([guid]::NewGuid())"
          Add-Content $env:GITHUB_OUTPUT "body<<$delimiter"
          Add-Content $env:GITHUB_OUTPUT ($notes -join "`n")
          Add-Content $env:GITHUB_OUTPUT $delimiter

      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe*
          if-no-files-found: error

  linux:
    # The oldest supported runner, so the AppImage runs on distributions with an older glibc.
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf

      - run: npm ci

      - run: cargo test
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage*
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  # One job writes latest.json from both builds, so neither platform's entry overwrites the other's.
  publish:
    if: github.event_name == 'push'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write latest.json and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.windows.outputs.notes }}
        run: |
          set -euo pipefail
          cd dist
          exe=$(echo nsis/*-setup.exe)
          appimage=$(echo appimage/*.AppImage)
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "$NOTES" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wsig "$(cat "$exe.sig")" \
            --arg wurl "$base/$(basename "$exe")" \
            --arg lsig "$(cat "$appimage.sig")" \
            --arg lurl "$base/$(basename "$appimage")" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "windows-x86_64": {signature: $wsig, url: $wurl},
              "linux-x86_64": {signature: $lsig, url: $lurl}}}' > latest.json
          # A draft until every file is attached, so the updater never finds a release without latest.json.
          gh release create "$TAG" --draft --title "Guild $TAG" --notes "$NOTES" \
            "$exe" "$exe.sig" "$appimage" "$appimage.sig" deb/*.deb latest.json
          gh release edit "$TAG" --draft=false
