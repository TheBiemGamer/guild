name: Bug report
description: Something in Guild doesn't work.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About
  - type: input
    id: os
    attributes:
      label: System
      description: Report a problem in Settings → About fills this in. On Linux, add your graphics card if the window looks wrong.
  - type: dropdown
    id: package
    attributes:
      label: How you installed Guild
      options:
        - Windows installer
        - AppImage
        - .deb
        - PKGBUILD (Arch)
        - Built it myself
  - type: input
    id: proton
    attributes:
      label: Proton
      description: Only for a Windows game on Linux. The Proton build it runs with, from its Launch options tab or Settings → Wine.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Settings → About → Open log folder; paste the end of launcher.log. It never contains passwords or tokens.
      render: text
