[package]
name = "launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6"
iced = { version = "0.14.0", features = ["image", "tokio"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = "0.13"
rusqlite = { version = "0.41", features = ["bundled"] }
steamlocate = "2.1"
tokio = { version = "1", default-features = false, features = ["rt"] }
winreg = "0.56"
