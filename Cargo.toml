[package]
name = "launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6"
iced = { version = "0.14.0", features = ["image", "tokio"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
keyvalues-parser = "0.2"
reqwest = "0.13"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamlocate = "2.1"
tao = "0.37"
tokio = { version = "1", default-features = false, features = ["rt"] }
winreg = "0.56"
wry = "0.57"
